name: C++ CMake CI Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            generator: "Unix Makefiles"
            cc: gcc
            cxx: g++

          - os: windows-latest
            generator: "MinGW Makefiles"
            cc: gcc
            cxx: g++

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Show Toolchain
        run: |
          gcc --version
          g++ --version
          cmake --version

      - name: Install Linux Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Setup MinGW
        if: matrix.os == 'windows-latest'
        uses: egor-tensin/setup-mingw@v3
        with:
          platform: x64

      - name: Configure CMake
        run: |
          cmake -S . -B build -G "${{ matrix.generator }}" -DCMAKE_BUILD_TYPE=Debug
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}

      - name: Build Project
        run: cmake --build build --config Debug

      - name: Run GoogleTest Suite
        run: |
          cd build
          ctest --output-on-failure -C Debug